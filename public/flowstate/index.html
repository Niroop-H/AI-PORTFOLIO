const canvas=document.querySelector(".fluid");let gl=canvas.getContext("webgl",{alpha:false,antialias:false});if(gl){const vertex=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;const frag=`precision highp float;uniform vec2 res;uniform float time;uniform vec2 mouse;uniform float burst;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}vec3 palette(float h){return .5+.5*cos(6.28318*(h+vec3(0.,.33,.67)));}void main(){vec2 uv=gl_FragCoord.xy/res;float asp=res.x/res.y;vec2 p=(uv-.5)*vec2(asp,1.);float t=time*.16;vec2 m=(mouse/res-.5)*vec2(asp,1.);float d=length(p-m);float swirl=sin(atan(p.y,p.x)*3.+t*2.+sin(p.x*7.-t)*2.);float n=noise(p*3.5+vec2(t,-t*.7));float waves=sin(p.x*5.+sin(p.y*4.+t)*2.+t)+cos(p.y*6.-t*1.5+sin(p.x*3.));float ribbons=sin((p.x+p.y*.7)*7.+swirl*2.+n*4.+t*3.);float ink=smoothstep(.45,.95,ribbons*.5+.5)*.8+smoothstep(.7,1.,waves*.5+.5)*.5;ink+=exp(-d*5.)*.8+burst*exp(-length(p)*3.)*.7;float hue=.5+n*.25+swirl*.055+t*.025;vec3 c=palette(hue)*ink*1.35;c*=smoothstep(1.1,.12,length(p));gl_FragColor=vec4(c+vec3(.004,.005,.012),1.);}`;function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}try{const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw gl.getProgramInfoLog(prog);gl.useProgram(prog);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(prog,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const resLoc=gl.getUniformLocation(prog,"res"),timeLoc=gl.getUniformLocation(prog,"time"),mouseLoc=gl.getUniformLocation(prog,"mouse"),burstLoc=gl.getUniformLocation(prog,"burst");let pointer={x:innerWidth*.5,y:innerHeight*.5},start=performance.now();const resize=()=>{const dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);gl.viewport(0,0,canvas.width,canvas.height)};addEventListener("resize",resize);resize();addEventListener("pointermove",e=>{pointer.x=e.clientX*(canvas.width/innerWidth);pointer.y=(innerHeight-e.clientY)*(canvas.height/innerHeight)} ,{passive:true});function draw(now){const t=(now-start)/1000;const angle=t*.65,r=Math.min(canvas.width,canvas.height)*.28;const x=canvas.width*.5+Math.cos(angle)*r,y=canvas.height*.5+Math.sin(angle*1.13)*r*.72;const burst=Math.max(0,1-t*1.1);gl.uniform2f(resLoc,canvas.width,canvas.height);gl.uniform1f(timeLoc,t);gl.uniform2f(mouseLoc,t>.7?x:pointer.x,t>.7?y:pointer.y);gl.uniform1f(burstLoc,burst);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(draw)}requestAnimationFrame(draw)}catch(err){console.warn("WebGL fluid fallback:",err);gl=null}}
